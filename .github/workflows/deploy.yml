name: CI/CD Pipeline - Quick Bites

on:
  push:
    branches:
      - main

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest bandit

      - name: Run DevSecOps Security Check (Bandit)
        run: |
          bandit -r . -x ./tests -ll

      - name: Run Automated Unit Tests
        run: |
          pytest tests/

      - name: Package Application Artifact
        run: |
          zip -r build-${{ github.run_number }}.zip . -x "*.git*"
          cp build-${{ github.run_number }}.zip build-latest.zip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload Artifact to AWS S3
        run: |
          aws s3 cp build-${{ github.run_number }}.zip s3://${{ secrets.S3_BUCKET_NAME }}/
          aws s3 cp build-latest.zip s3://${{ secrets.S3_BUCKET_NAME }}/

      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/food_app
            aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/build-latest.zip .
            unzip -o build-latest.zip
            rm build-latest.zip
            python3 -m venv venv
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart foodapp